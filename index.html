<!doctype html>
<html lang="en-GB">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>William Hickmott</title>
    <meta name="description" content="Software, research tools and interactive projects by William Hickmott.">
    <style>
        :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07090d; color: #eceff4; }
        main { width: min(760px, calc(100% - 40px)); }
        h1 { margin: 0 0 8px; font-size: clamp(30px, 5vw, 48px); font-weight: 650; }
        p { margin: 0 0 28px; color: #9da6b4; font-size: 16px; }
        .tools { display: grid; gap: 12px; }
        a { display: block; padding: 18px 20px; border: 1px solid #303642; border-radius: 10px; background: #11151c; color: inherit; text-decoration: none; }
        a:hover { border-color: #697586; background: #151a22; }
        strong { display: block; margin-bottom: 5px; font-size: 17px; font-weight: 600; }
        span { color: #9da6b4; font-size: 14px; }
    </style>
</head>
<body>
    <main>
        <h1>William Hickmott</h1>
        <p>Software, research tools and interactive projects.</p>
        <div class="tools">
            <a href="./asteroid/">
                <strong>Asteroid Mesh Generator</strong>
                <span>Procedural asteroid and binary-asteroid mesh generation in the browser.</span>
            </a>
        </div>
    </main>
</body>
</html>
